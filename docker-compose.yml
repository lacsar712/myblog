services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myblog
      TZ: Asia/Shanghai
    ports:
      - "3506:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      TZ: Asia/Shanghai
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: myblog
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3501:80"

volumes:
  db_data:

